{% extends "base.html" %}{% block title %}Login · MGT Vouchers{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <img src="{{ url_for('static',filename='img/mgt-logo.png') }}" alt="MGT" class="login-logo">
    <h2>Welcome back</h2>
    <p class="sub">Sign in with your employee or manager account.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="username">Username</label>
      <div class="input-icon mb-3"><i class="bi bi-person"></i><input id="username" name="username" class="form-control form-control-lg" required autofocus autocomplete="username" placeholder="Enter your username"></div>
      <label class="form-label" for="password">Password</label>
      <div class="input-icon mb-4"><i class="bi bi-lock"></i><input id="password" type="password" name="password" class="form-control form-control-lg" required autocomplete="current-password" placeholder="Enter your password"></div>
      <button class="btn btn-brand btn-lg w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
